{% extends "base.html" %}
{% block content %}
<div class="page-head"><h1><span class="ico">⚙️</span>{{ T('nav_my_settings') }}</h1></div>

<div class="card">
  <h2>{{ T('change_password') }}</h2>
  <p class="muted">{{ T('pw_hint') }}</p>
  <form method="post">
    <div class="form-row">
      <input type="password" name="old_password" placeholder="{{ T('old_password') }}" required>
      <input type="password" name="new_password" placeholder="{{ T('new_password') }}" required>
      <input type="password" name="confirm_password" placeholder="{{ T('confirm_password') }}" required>
      <button class="btn btn-green" type="submit">💾 {{ T('save') }}</button>
    </div>
  </form>
</div>
{% endblock %}
